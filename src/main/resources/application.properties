# Database (no credentials are committed; supplied via environment).
app.db.url=${DB_URL:jdbc:mysql://localhost:3306/testing}
app.db.user=${DB_USER:}
app.db.password=${DB_PASSWORD:}

# HMAC secret for signing JWTs. Required, minimum 32 characters. The app
# refuses to start without it.
app.jwt.secret=${JWT_SECRET:}

# Swagger UI and the OpenAPI document are on by default for this demo.
# Set SWAGGER_ENABLED=false to disable both.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Do not leak framework internals in error responses or headers.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.server-header=
server.tomcat.max-swallow-size=1MB
spring.jackson.default-property-inclusion=non_null
