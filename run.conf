# compose-launcher config for java-rest-example (https://github.com/Nate314/java-rest-example)
port APP_PORT 8080
port PMA_PORT 8082
port MYSQL_PORT 3306

url App:        http://localhost:{APP_PORT}
url Swagger UI: http://localhost:{APP_PORT}/swagger-ui.html
url phpMyAdmin: http://localhost:{PMA_PORT}
url MySQL:      127.0.0.1:{MYSQL_PORT}

# Random values for a new .env. The database passwords only apply when mysql-data is created.
secret MYSQL_ROOT_PASSWORD 32 mysql-data
secret DB_PASSWORD 32 mysql-data
secret JWT_SECRET 48
